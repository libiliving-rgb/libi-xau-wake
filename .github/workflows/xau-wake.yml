name: LiBi XAU Wake

on:
  push:
    paths:
      - '.github/workflows/xau-wake.yml'
      - 'runner/**'
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: libi-xau-state
  cancel-in-progress: false

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Calculate and preserve encrypted state
        env:
          LIBI_XAU_WAKE_SECRET: ${{ secrets.LIBI_XAU_WAKE_SECRET }}
        run: |
          node runner/test.cjs
          node runner/runner.cjs
      - name: Commit only encrypted observations
        run: |
          set -euo pipefail
          git config user.name 'LiBi XAU tracker'
          git config user.email 'libi-xau-tracker@users.noreply.github.com'
          git add state/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record encrypted XAU observation'
          git push origin HEAD:main
      - name: Optional authenticated delivery callback
        env:
          LIBI_XAU_SITE_TOKEN: ${{ secrets.LIBI_XAU_SITE_TOKEN }}
        run: node runner/delivery.cjs
      # No calls to suspended Floot, paid data plans, broker orders or raw public feed.
